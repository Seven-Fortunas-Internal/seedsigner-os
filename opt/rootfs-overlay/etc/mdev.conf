# mmcblk0p1 disabled on pi02w: this board has no separate microSD slot for
# settings storage -- mmcblk0p1 IS the boot partition, so this hotplug rule was
# firing on the boot partition itself during early init, right where a real Pi
# hung after "Volume was not properly unmounted" (jorge, 2026-09-08).
# mmcblk0p1 root:root 777 */etc/mdev/mdev.sh
